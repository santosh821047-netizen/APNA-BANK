<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APNA BANK</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef3f8;
 color:#17202a
}
header{
 background:#123c69;
 color:#fff;
 padding:12px 18px;
 display:flex;
 justify-content:space-between;
 align-items:center
}
header h1{margin:0;font-size:24px}
.container{max-width:1100px;margin:auto;padding:12px}
.card{
 background:#fff;
 border-radius:10px;
 padding:14px;
 margin-bottom:12px;
 box-shadow:0 2px 8px #0001
}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{
 padding:10px;
 border-radius:6px;
 border:1px solid #bbc5d0;
 font-size:14px
}
button{
 background:#123c69;
 color:#fff;
 border:0;
 cursor:pointer
}
.btn-green{background:#16803c}
.btn-red{background:#b42318}
.btn-gray{background:#59636e}
.hidden{display:none}

.customer-head{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px
}
.info{
 background:#f3f6f9;
 padding:9px;
 border-radius:7px
}
.info b{
 display:block;
 font-size:12px;
 color:#65727e
}
.info span{font-size:15px}

.work-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px
}
.work-grid button{min-height:42px}

.customer-item{
 border:1px solid #d8dee5;
 border-radius:8px;
 padding:10px;
 margin-bottom:7px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px
}

.notice{
 padding:10px;
 border-radius:6px;
 margin-top:8px;
 background:#edf7ff
}

.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:1000
}
.modal-box{
 background:#fff;
 width:100%;
 max-width:400px;
 border-radius:10px;
 padding:18px
}
.modal-box input{width:100%;margin:8px 0}

table{
 width:100%;
 border-collapse:collapse;
 font-size:13px
}
th,td{
 border:1px solid #d8dee5;
 padding:7px;
 text-align:left
}
th{background:#f1f4f7}

@media(max-width:750px){
 .customer-head{grid-template-columns:repeat(2,1fr)}
 .work-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
<h1>APNA BANK</h1>
<span>Banking Work Simulation</span>
</header>

<div class="container">

<div class="card">
<h3>Customer Search / Account Opening</h3>

<div class="row">
<input id="searchAccount" placeholder="12-अंकीय Account Number">
<button id="searchBtn">Search</button>
<button id="allBtn" class="btn-gray">All Customers</button>
<button id="newAccountBtn" class="btn-green">+ नया खाता</button>
</div>

<div id="message"></div>
</div>


<div id="accountForm" class="card hidden">
<h3>नया ग्राहक / नया खाता</h3>

<div class="row">
<input id="newName" placeholder="ग्राहक का नाम">

<select id="newType">
<option value="Savings">Savings Account</option>
<option value="Current">Current Account</option>
</select>

<input id="openingBalance" type="number" min="0" placeholder="Opening Balance">

<button id="createBtn" class="btn-green">खाता खोलें</button>
<button id="cancelAccountBtn" class="btn-gray">Cancel</button>
</div>
</div>


<div id="allCustomers" class="card hidden">
<h3>सभी ग्राहक</h3>
<div id="customerList"></div>
</div>


<div id="customerSection" class="hidden">

<div class="card">
<h3>Customer Details</h3>

<div class="customer-head">

<div class="info">
<b>नाम</b>
<span id="cName">-</span>
</div>

<div class="info">
<b>Account Number</b>
<span id="cAccount">-</span>
</div>

<div class="info">
<b>Account Type</b>
<span id="cType">-</span>
</div>

<div class="info">
<b>Balance</b>
<span id="cBalance">₹0</span>
</div>

</div>
</div>


<div class="card">
<h3>Banking Work</h3>

<div class="work-grid">

<button data-work="deposit">पैसा जमा</button>
<button data-work="withdraw">पैसा निकालना</button>
<button data-work="balance">Balance Check</button>
<button data-work="transfer">Money Transfer</button>
<button data-work="kyc">KYC Update</button>
<button data-work="cheque">Cheque</button>
<button data-work="atm">ATM / Debit Card</button>
<button data-work="upi">UPI</button>
<button data-work="fd">FD / RD</button>
<button data-work="loan">Loan</button>
<button data-work="statement">Statement</button>
<button data-work="delete" class="btn-red">Account Delete</button>

</div>
</div>


<div id="workPanel" class="card hidden"></div>

</div>

</div>


<!-- PASSWORD -->
<div id="passwordModal" class="modal hidden">

<div class="modal-box">

<h3>Banking Work Password</h3>

<p>Banking work करने के लिए password डालें।</p>

<input id="passwordInput"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="Password">

<div class="row">

<button id="continueBtn">Continue</button>

<button id="closePasswordBtn" class="btn-gray">
Cancel
</button>

</div>

<div id="passwordMessage"></div>

</div>
</div>


<script>

"use strict";

const BANK_PASSWORD = "2468";

let customers = [];

try{
 customers = JSON.parse(
  localStorage.getItem("apnaBankCustomers") || "[]"
 );

 if(!Array.isArray(customers)){
  customers=[];
 }
}catch(e){
 customers=[];
}

let selectedAccount = null;
let pendingWork = null;


/* ---------- BASIC FUNCTIONS ---------- */

function saveData(){
 localStorage.setItem(
  "apnaBankCustomers",
  JSON.stringify(customers)
 );
}

function money(amount){
 return "₹" + Number(amount || 0).toLocaleString("en-IN");
}

function accountNumber(){

 let number;

 do{
  number="";
  for(let i=0;i<12;i++){
   number += Math.floor(Math.random()*10);
  }
 }while(customers.some(c=>c.account===number));

 return number;
}

function getCustomer(){

 return customers.find(
  c=>c.account===selectedAccount
 );
}

function safe(text){

 return String(text ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}


/* ---------- ACCOUNT OPENING ---------- */

document.getElementById("newAccountBtn")
.addEventListener("click",function(){

 document.getElementById("accountForm")
 .classList.remove("hidden");

});


document.getElementById("cancelAccountBtn")
.addEventListener("click",function(){

 document.getElementById("accountForm")
 .classList.add("hidden");

});


document.getElementById("createBtn")
.addEventListener("click",function(){

 const name=document
 .getElementById("newName").value.trim();

 const type=document
 .getElementById("newType").value;

 const balance=Number(
  document.getElementById("openingBalance").value || 0
 );

 if(!name){
  alert("ग्राहक का नाम डालें।");
  return;
 }

 if(balance<0){
  alert("Opening Balance सही डालें।");
  return;
 }

 const customer={
  id:Date.now(),
  name:name,
  account:accountNumber(),
  type:type,
  balance:balance,
  kyc:"Pending",
  cheque:"Not Issued",
  atm:"Not Issued",
  upi:"Not Registered",
  fd:[],
  loan:[],
  transactions:[
   {
    date:new Date().toLocaleString("en-IN"),
    type:"Account Opening",
    amount:balance,
    details:"New account created"
   }
  ]
 };

 customers.push(customer);
 saveData();

 document.getElementById("newName").value="";
 document.getElementById("openingBalance").value="";

 document.getElementById("accountForm")
 .classList.add("hidden");

 selectCustomer(customer.account);

 alert(
  "खाता सफलतापूर्वक खुल गया।\n\n"+
  "Customer: "+customer.name+
  "\nAccount Number: "+customer.account
 );

});


/* ---------- SEARCH ---------- */

document.getElementById("searchBtn")
.addEventListener("click",searchCustomer);

document.getElementById("searchAccount")
.addEventListener("keydown",function(e){

 if(e.key==="Enter"){
  searchCustomer();
 }

});


function searchCustomer(){

 const account=document
 .getElementById("searchAccount")
 .value.trim();

 if(!/^\d{12}$/.test(account)){
  alert("12 अंकों का Account Number डालें।");
  return;
 }

 selectCustomer(account);
}


function selectCustomer(account){

 const c=customers.find(
  x=>x.account===account
 );

 if(!c){
  alert("Customer नहीं मिला।");
  return;
 }

 selectedAccount=account;

 document.getElementById("customerSection")
 .classList.remove("hidden");

 document.getElementById("allCustomers")
 .classList.add("hidden");

 document.getElementById("workPanel")
 .classList.add("hidden");

 updateDetails();

 window.scrollTo(0,0);
}


function updateDetails(){

 const c=getCustomer();

 if(!c)return;

 document.getElementById("cName").textContent=c.name;
 document.getElementById("cAccount").textContent=c.account;
 document.getElementById("cType").textContent=c.type;
 document.getElementById("cBalance").textContent=money(c.balance);
}


/* ---------- ALL CUSTOMERS ---------- */

document.getElementById("allBtn")
.addEventListener("click",showAllCustomers);


function showAllCustomers(){

 const box=document
 .getElementById("allCustomers");

 const list=document
 .getElementById("customerList");

 box.classList.remove("hidden");

 if(customers.length===0){

  list.innerHTML="<p>अभी कोई customer नहीं है।</p>";
  return;

 }

 list.innerHTML=customers.map(function(c){

  return `
  <div class="customer-item">

   <div>
    <b>${safe(c.name)}</b><br>
    <small>
    ${c.account} |
    ${safe(c.type)} |
    ${money(c.balance)}
    </small>
   </div>

   <button data-select="${c.account}">
   Work
   </button>

  </div>
  `;

 }).join("");

 list.querySelectorAll("[data-select]")
 .forEach(function(btn){

  btn.addEventListener("click",function(){

   selectCustomer(btn.dataset.select);

  });

 });

}


/* ---------- WORK BUTTONS ---------- */

document.querySelectorAll("[data-work]")
.forEach(function(btn){

 btn.addEventListener("click",function(){

  startWork(btn.dataset.work);

 });

});


function startWork(work){

 if(!selectedAccount){
  alert("पहले customer select करें।");
  return;
 }

 pendingWork=work;

 const modal=document
 .getElementById("passwordModal");

 const input=document
 .getElementById("passwordInput");

 document.getElementById("passwordMessage")
 .innerHTML="";

 input.value="";

 modal.classList.remove("hidden");

 setTimeout(function(){
  input.focus();
 },100);
}


/* ---------- PASSWORD FIX ---------- */

document.getElementById("continueBtn")
.addEventListener("click",checkPassword);


document.getElementById("closePasswordBtn")
.addEventListener("click",closePassword);


document.getElementById("passwordInput")
.addEventListener("keydown",function(e){

 if(e.key==="Enter"){
  e.preventDefault();
  checkPassword();
 }

});


function closePassword(){

 document.getElementById("passwordModal")
 .classList.add("hidden");

 document.getElementById("passwordInput").value="";

 pendingWork=null;
}


function checkPassword(){

 const input=document
 .getElementById("passwordInput");

 const password=input.value.trim();

 if(password === BANK_PASSWORD){

  const work=pendingWork;

  document.getElementById("passwordModal")
  .classList.add("hidden");

  input.value="";
  pendingWork=null;

  showWork(work);

 }else{

  document.getElementById("passwordMessage")
  .innerHTML=
  '<div class="notice">गलत password। Password 2468 है।</div>';

  input.focus();
 }

}


/* ---------- WORK PANEL ---------- */

function showWork(work){

 const panel=document
 .getElementById("workPanel");

 const contentTitles={
  deposit:"पैसा जमा",
  withdraw:"पैसा निकालना",
  balance:"Balance Check",
  transfer:"Money Transfer",
  kyc:"KYC Update",
  cheque:"Cheque",
  atm:"ATM / Debit Card",
  upi:"UPI",
  fd:"FD / RD",
  loan:"Loan",
  statement:"Account Statement",
  delete:"Account Delete"
 };

 panel.classList.remove("hidden");

 panel.innerHTML=
 "<h3>"+contentTitles[work]+"</h3>"+
 '<div id="workContent"></div>';

 const box=document
 .getElementById("workContent");


 if(work==="deposit"){

  box.innerHTML=`
   <input id="amount"
   type="number"
   min="1"
   placeholder="जमा राशि">

   <button id="depositBtn">
   पैसा जमा करें
   </button>
  `;

  document.getElementById("depositBtn")
  .addEventListener("click",deposit);

 }


 else if(work==="withdraw"){

  box.innerHTML=`
   <input id="amount"
   type="number"
   min="1"
   placeholder="निकासी राशि">

   <button id="withdrawBtn">
   पैसा निकालें
   </button>
  `;

  document.getElementById("withdrawBtn")
  .addEventListener("click",withdraw);

 }


 else if(work==="balance"){

  const c=getCustomer();

  box.innerHTML=`
   <div class="notice">
   उपलब्ध Balance:
   <b>${money(c.balance)}</b>
   </div>
   <br>
   <button id="backBtn">Back</button>
  `;

  document.getElementById("backBtn")
  .addEventListener("click",backToCustomer);

 }


 else if(work==="transfer"){

  box.innerHTML=`
   <input id="receiver"
   inputmode="numeric"
   maxlength="12"
   placeholder="Receiver Account Number">

   <input id="amount"
   type="number"
   min="1"
   placeholder="Transfer Amount">

   <button id="transferBtn">
   Transfer
   </button>
  `;

  document.getElementById("transferBtn")
  .addEventListener("click",transfer);

 }


 else if(work==="kyc"){

  const c=getCustomer();

  box.innerHTML=`
   <p>Current KYC:
   <b>${safe(c.kyc)}</b></p>

   <input id="kycRef"
   placeholder="KYC Reference Number">

   <button id="kycBtn">
   KYC Update
   </button>
  `;

  document.getElementById("kycBtn")
  .addEventListener("click",updateKyc);

 }


 else if(work==="cheque"){

  const c=getCustomer();

  box.innerHTML=`
   <p>Status:
   <b>${safe(c.cheque)}</b></p>

   <button id="chequeBtn">
   Issue Cheque Book
   </button>
  `;

  document.getElementById("chequeBtn")
  .addEventListener("click",issueCheque);

 }


 else if(work==="atm"){

  const c=getCustomer();

  box.innerHTML=`
   <p>ATM/Debit Card:
   <b>${safe(c.atm)}</b></p>

   <button id="atmBtn">
   Issue ATM/Debit Card
   </button>
  `;

  document.getElementById("atmBtn")
  .addEventListener("click",issueATM);

 }


 else if(work==="upi"){

  const c=getCustomer();

  box.innerHTML=`
   <p>UPI Status:
   <b>${safe(c.upi)}</b></p>

   <input id="upiId"
   placeholder="UPI ID">

   <button id="upiBtn">
   Register UPI
   </button>
  `;

  document.getElementById("upiBtn")
  .addEventListener("click",registerUPI);

 }


 else if(work==="fd"){

  box.innerHTML=`
   <input id="fdAmount"
   type="number"
   min="1"
   placeholder="FD Amount">

   <input id="fdYears"
   type="number"
   min="1"
   placeholder="Period (Years)">

   <button id="fdBtn">
   Create FD
   </button>

   <div id="fdRecords"></div>
  `;

  document.getElementById("fdBtn")
  .addEventListener("click",createFD);

  renderFD();

 }


 else if(work==="loan"){

  box.innerHTML=`
   <input id="loanAmount"
   type="number"
   min="1"
   placeholder="Loan Amount">

   <select id="loanType">
   <option>Personal Loan</option>
   <option>Home Loan</option>
   <option>Education Loan</option>
   <option>Vehicle Loan</option>
   </select>

   <button id="loanBtn">
   Apply Loan
   </button>

   <div id="loanRecords"></div>
  `;

  document.getElementById("loanBtn")
  .addEventListener("click",applyLoan);

  renderLoans();

 }


 else if(work==="statement"){

  renderStatement();

 }


 else if(work==="delete"){

  const c=getCustomer();

  box.innerHTML=`
   <div class="notice">
   Customer: <b>${safe(c.name)}</b><br>
   Account: <b>${c.account}</b><br>
   Balance: <b>${money(c.balance)}</b>
   </div>

   <br>

   <button id="deleteBtn" class="btn-red">
   Permanently Delete Account
   </button>
  `;

  document.getElementById("deleteBtn")
  .addEventListener("click",deleteAccount);

 }

}


/* ---------- DEPOSIT ---------- */

function deposit(){

 const amount=Number(
  document.getElementById("amount").value
 );

 if(!Number.isFinite(amount)||amount<=0){
  alert("सही राशि डालें।");
  return;
 }

 const c=getCustomer();

 c.balance+=amount;

 c.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"Deposit",
  amount:amount,
  details:"Cash deposit"
 });

 saveData();
 updateDetails();

 alert("पैसा जमा हो गया।");

 backToCustomer();
}


/* ---------- WITHDRAW ---------- */

function withdraw(){

 const amount=Number(
  document.getElementById("amount").value
 );

 if(!Number.isFinite(amount)||amount<=0){
  alert("सही राशि डालें।");
  return;
 }

 const c=getCustomer();

 if(amount>c.balance){
  alert("Insufficient Balance.");
  return;
 }

 c.balance-=amount;

 c.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"Withdrawal",
  amount:amount,
  details:"Cash withdrawal"
 });

 saveData();
 updateDetails();

 alert("पैसा निकाल दिया गया।");

 backToCustomer();
}


/* ---------- TRANSFER ---------- */

function transfer(){

 const receiverNo=document
 .getElementById("receiver").value.trim();

 const amount=Number(
  document.getElementById("amount").value
 );

 if(!/^\d{12}$/.test(receiverNo)){
  alert("12 अंकों का receiver account डालें।");
  return;
 }

 if(amount<=0){
  alert("सही राशि डालें।");
  return;
 }

 const sender=getCustomer();

 const receiver=customers.find(
  c=>c.account===receiverNo
 );

 if(!receiver){
  alert("Receiver account नहीं मिला।");
  return;
 }

 if(receiver.account===sender.account){
  alert("अपने ही account में transfer नहीं कर सकते।");
  return;
 }

 if(amount>sender.balance){
  alert("Insufficient Balance.");
  return;
 }

 sender.balance-=amount;
 receiver.balance+=amount;

 sender.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"Transfer Debit",
  amount:amount,
  details:"To "+receiver.account
 });

 receiver.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"Transfer Credit",
  amount:amount,
  details:"From "+sender.account
 });

 saveData();
 updateDetails();

 alert("Transfer successful.");

 backToCustomer();
}


/* ---------- KYC ---------- */

function updateKyc(){

 const ref=document
 .getElementById("kycRef").value.trim();

 if(!ref){
  alert("KYC reference number डालें।");
  return;
 }

 const c=getCustomer();

 c.kyc="Updated";

 c.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"KYC Update",
  amount:0,
  details:ref
 });

 saveData();

 alert("KYC Update complete.");

 backToCustomer();
}


/* ---------- CHEQUE ---------- */

function issueCheque(){

 const c=getCustomer();

 if(c.cheque==="Issued"){
  alert("Cheque Book पहले से issued है।");
  return;
 }

 c.cheque="Issued";

 c.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"Cheque Book",
  amount:0,
  details:"Issued"
 });

 saveData();

 alert("Cheque Book issued.");

 backToCustomer();
}


/* ---------- ATM ---------- */

function issueATM(){

 const c=getCustomer();

 if(c.atm==="Issued"){
  alert("ATM/Debit Card पहले से issued है।");
  return;
 }

 c.atm="Issued";

 c.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"ATM/Debit Card",
  amount:0,
  details:"Issued"
 });

 saveData();

 alert("ATM/Debit Card issued.");

 backToCustomer();
}


/* ---------- UPI ---------- */

function registerUPI(){

 const upi=document
 .getElementById("upiId").value.trim();

 if(!upi){
  alert("UPI ID डालें।");
  return;
 }

 const c=getCustomer();

 c.upi=upi;

 c.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"UPI Registration",
  amount:0,
  details:upi
 });

 saveData();

 alert("UPI registered.");

 backToCustomer();
}


/* ---------- FD ---------- */

function createFD(){

 const amount=Number(
  document.getElementById("fdAmount").value
 );

 const years=Number(
  document.getElementById("fdYears").value
 );

 const c=getCustomer();

 if(amount<=0||years<=0){
  alert("सही amount और period डालें।");
  return;
 }

 if(amount>c.balance){
  alert("FD के लिए पर्याप्त balance नहीं है।");
  return;
 }

 c.balance-=amount;

 c.fd.push({
  id:Date.now(),
  amount:amount,
  years:years,
  date:new Date().toLocaleDateString("en-IN"),
  status:"Active"
 });

 c.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"FD",
  amount:amount,
  details:years+" years"
 });

 saveData();
 updateDetails();

 alert("FD successfully created.");

 backToCustomer();
}


function renderFD(){

 const c=getCustomer();

 const box=document
 .getElementById("fdRecords");

 if(!box)return;

 if(!c.fd.length){
  box.innerHTML="<p>No FD records.</p>";
  return;
 }

 box.innerHTML=`
 <h4>FD Records</h4>

 <table>
 <tr>
 <th>Amount</th>
 <th>Years</th>
 <th>Date</th>
 <th>Status</th>
 </tr>

 ${c.fd.map(function(fd){

 return `
 <tr>
 <td>${money(fd.amount)}</td>
 <td>${fd.years}</td>
 <td>${safe(fd.date)}</td>
 <td>${safe(fd.status)}</td>
 </tr>
 `;

 }).join("")}

 </table>
 `;
}


/* ---------- LOAN ---------- */

function applyLoan(){

 const amount=Number(
  document.getElementById("loanAmount").value
 );

 const type=document
 .getElementById("loanType").value;

 if(amount<=0){
  alert("Loan amount डालें।");
  return;
 }

 const c=getCustomer();

 c.loan.push({
  id:Date.now(),
  amount:amount,
  type:type,
  date:new Date().toLocaleDateString("en-IN"),
  status:"Application Submitted"
 });

 c.transactions.push({
  date:new Date().toLocaleString("en-IN"),
  type:"Loan Application",
  amount:amount,
  details:type
 });

 saveData();

 alert("Loan application submitted.");
