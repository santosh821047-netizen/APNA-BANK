<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APNA BANK</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef3f8;
  color:#17202a;
}
header{
  background:#123c69;
  color:white;
  padding:12px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;font-size:24px}
header span{font-size:13px}
.container{max-width:1100px;margin:auto;padding:12px}
.card{
  background:white;
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
input,select,button{
  padding:9px 10px;
  border-radius:6px;
  border:1px solid #bbc5d0;
  font-size:14px;
}
input,select{background:white}
button{
  cursor:pointer;
  background:#123c69;
  color:white;
  border:none;
}
button:hover{opacity:.9}
.btn-danger{background:#b42318}
.btn-green{background:#16803c}
.btn-gray{background:#59636e}
.hidden{display:none}
.customer-head{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.info{
  background:#f3f6f9;
  padding:9px;
  border-radius:7px;
}
.info b{display:block;font-size:12px;color:#65727e}
.info span{font-size:15px}
.work-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.work-grid button{font-size:13px}
.customer-list{
  max-height:380px;
  overflow:auto;
}
.customer-item{
  border:1px solid #d8dee5;
  border-radius:8px;
  padding:10px;
  margin-bottom:7px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.customer-item small{color:#667}
.modal{
  position:fixed;
  inset:0;
  background:#0007;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-box{
  background:white;
  width:100%;
  max-width:430px;
  border-radius:10px;
  padding:18px;
}
.modal-box h3{margin-top:0}
.notice{
  padding:9px;
  border-radius:6px;
  margin-top:8px;
  background:#edf7ff;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  border:1px solid #d8dee5;
  padding:7px;
  text-align:left;
}
th{background:#f1f4f7}
@media(max-width:750px){
 .customer-head{grid-template-columns:repeat(2,1fr)}
 .work-grid{grid-template-columns:repeat(2,1fr)}
 header h1{font-size:20px}
}
</style>
</head>

<body>

<header>
  <h1>APNA BANK</h1>
  <span>Banking Work Simulation</span>
</header>

<div class="container">

  <div class="card">
    <h3 style="margin-top:0">Customer Search / Account Opening</h3>

    <div class="row">
      <input id="searchAccount" placeholder="12-अंकीय Account Number">
      <button onclick="searchCustomer()">Search</button>
      <button class="btn-gray" onclick="showAllCustomers()">All Customers</button>
      <button class="btn-green" onclick="openAccountForm()">+ नया खाता</button>
    </div>

    <div id="message"></div>
  </div>

  <div id="accountForm" class="card hidden">
    <h3>नया ग्राहक / नया खाता</h3>

    <div class="row">
      <input id="newName" placeholder="ग्राहक का पूरा नाम">
      <select id="newType">
        <option value="Savings">Savings Account</option>
        <option value="Current">Current Account</option>
      </select>
      <input id="openingBalance" type="number" min="0" placeholder="Opening Balance">
      <button onclick="createAccount()">खाता खोलें</button>
      <button class="btn-gray" onclick="closeAccountForm()">Cancel</button>
    </div>
  </div>

  <div id="allCustomers" class="card hidden">
    <h3 style="margin-top:0">सभी ग्राहक</h3>
    <div id="customerList" class="customer-list"></div>
  </div>

  <div id="customerSection" class="hidden">

    <div class="card">
      <h3 style="margin:0 0 10px">Customer Details</h3>

      <div class="customer-head">
        <div class="info">
          <b>नाम</b>
          <span id="cName">-</span>
        </div>
        <div class="info">
          <b>Account Number</b>
          <span id="cAccount">-</span>
        </div>
        <div class="info">
          <b>Account Type</b>
          <span id="cType">-</span>
        </div>
        <div class="info">
          <b>Balance</b>
          <span id="cBalance">₹0</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Banking Work</h3>

      <div class="work-grid">
        <button onclick="startWork('deposit')">पैसा जमा</button>
        <button onclick="startWork('withdraw')">पैसा निकालना</button>
        <button onclick="startWork('balance')">Balance Check</button>
        <button onclick="startWork('transfer')">Money Transfer</button>
        <button onclick="startWork('kyc')">KYC Update</button>
        <button onclick="startWork('cheque')">Cheque</button>
        <button onclick="startWork('atm')">ATM / Debit Card</button>
        <button onclick="startWork('upi')">UPI</button>
        <button onclick="startWork('fd')">FD / RD</button>
        <button onclick="startWork('loan')">Loan</button>
        <button onclick="startWork('statement')">Statement</button>
        <button class="btn-danger" onclick="startWork('delete')">Account Delete</button>
      </div>
    </div>

    <div id="workPanel" class="card hidden"></div>

  </div>

</div>

<!-- PASSWORD MODAL -->
<div id="passwordModal" class="modal hidden">
  <div class="modal-box">
    <h3>Password Required</h3>
    <p>Banking work करने के लिए password डालें।</p>

    <input id="passwordInput" type="password" placeholder="Password" style="width:100%">

    <div class="row" style="margin-top:10px">
      <button onclick="checkPassword()">Continue</button>
      <button class="btn-gray" onclick="closePassword()">Cancel</button>
    </div>

    <div id="passwordMessage"></div>
  </div>
</div>

<script>

const BANK_PASSWORD = "2468";

let customers = JSON.parse(localStorage.getItem("apnaBankCustomers") || "[]");
let selectedAccount = null;
let pendingWork = null;

function saveCustomers(){
  localStorage.setItem("apnaBankCustomers", JSON.stringify(customers));
}

function money(n){
  return "₹" + Number(n || 0).toLocaleString("en-IN");
}

function generateAccountNumber(){

  let number;

  do{
    number = "";

    for(let i=0;i<12;i++){
      number += Math.floor(Math.random()*10);
    }

  }while(customers.some(c => c.account === number));

  return number;
}

function showMessage(text, type="info"){
  const box = document.getElementById("message");

  box.innerHTML =
    `<div class="notice">${text}</div>`;
}

function openAccountForm(){
  document.getElementById("accountForm").classList.remove("hidden");
}

function closeAccountForm(){
  document.getElementById("accountForm").classList.add("hidden");
}

function createAccount(){

  const name = document.getElementById("newName").value.trim();
  const type = document.getElementById("newType").value;
  const balance = Number(document.getElementById("openingBalance").value || 0);

  if(!name){
    alert("ग्राहक का नाम डालें।");
    return;
  }

  if(balance < 0){
    alert("Balance सही डालें।");
    return;
  }

  const customer = {
    id: Date.now(),
    name:name,
    account:generateAccountNumber(),
    type:type,
    balance:balance,
    kyc:"Pending",
    cheque:"Not Issued",
    atm:"Not Issued",
    upi:"Not Registered",
    fd:[],
    rd:[],
    loan:[],
    transactions:[
      {
        date:new Date().toLocaleString("en-IN"),
        type:"Account Opening",
        amount:balance,
        details:"New account created"
      }
    ]
  };

  customers.push(customer);
  saveCustomers();

  document.getElementById("newName").value="";
  document.getElementById("openingBalance").value="";

  closeAccountForm();

  selectCustomer(customer.account);

  alert(
    "खाता सफलतापूर्वक खुल गया।\n\n" +
    "Customer: " + customer.name +
    "\nAccount Number: " + customer.account
  );
}

function searchCustomer(){

  const account =
    document.getElementById("searchAccount").value.trim();

  if(!/^\d{12}$/.test(account)){
    alert("12 अंकों का सही Account Number डालें।");
    return;
  }

  selectCustomer(account);
}

function selectCustomer(account){

  const customer =
    customers.find(c => c.account === account);

  if(!customer){
    alert("इस Account Number का कोई customer नहीं मिला।");
    return;
  }

  selectedAccount = account;

  document.getElementById("customerSection")
    .classList.remove("hidden");

  document.getElementById("allCustomers")
    .classList.add("hidden");

  document.getElementById("workPanel")
    .classList.add("hidden");

  updateCustomerDetails();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function getSelectedCustomer(){

  return customers.find(
    c => c.account === selectedAccount
  );
}

function updateCustomerDetails(){

  const c = getSelectedCustomer();

  if(!c) return;

  document.getElementById("cName").textContent=c.name;
  document.getElementById("cAccount").textContent=c.account;
  document.getElementById("cType").textContent=c.type;
  document.getElementById("cBalance").textContent=money(c.balance);
}

function showAllCustomers(){

  const box=document.getElementById("allCustomers");
  const list=document.getElementById("customerList");

  box.classList.remove("hidden");

  if(customers.length===0){
    list.innerHTML="<p>अभी कोई customer नहीं है।</p>";
    return;
  }

  list.innerHTML=customers.map(c => `

    <div class="customer-item">

      <div>
        <b>${escapeHtml(c.name)}</b><br>
        <small>${c.account} | ${c.type} | ${money(c.balance)}</small>
      </div>

      <button onclick="selectCustomer('${c.account}')">
        Work
      </button>

    </div>

  `).join("");
}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* PASSWORD */

function startWork(work){

  if(!selectedAccount){
    alert("पहले customer select करें।");
    return;
  }

  pendingWork=work;

  document.getElementById("passwordInput").value="";
  document.getElementById("passwordMessage").innerHTML="";

  document.getElementById("passwordModal")
    .classList.remove("hidden");

  setTimeout(()=>{
    document.getElementById("passwordInput").focus();
  },100);
}

function closePassword(){

  document.getElementById("passwordModal")
    .classList.add("hidden");

  pendingWork=null;
}

function checkPassword(){

  const password =
    document.getElementById("passwordInput").value;

  if(password !== BANK_PASSWORD){

    document.getElementById("passwordMessage").innerHTML =
      '<div class="notice">गलत password।</div>';

    return;
  }

  document.getElementById("passwordModal")
    .classList.add("hidden");

  const work=pendingWork;
  pendingWork=null;

  showWorkPanel(work);
}

/* WORK PANEL */

function showWorkPanel(work){

  const panel=document.getElementById("workPanel");

  panel.classList.remove("hidden");

  const titles={
    deposit:"पैसा जमा",
    withdraw:"पैसा निकालना",
    balance:"Balance Check",
    transfer:"Money Transfer",
    kyc:"KYC Update",
    cheque:"Cheque",
    atm:"ATM / Debit Card",
    upi:"UPI",
    fd:"FD / RD",
    loan:"Loan",
    statement:"Account Statement",
    delete:"Account Delete"
  };

  panel.innerHTML=`
    <h3 style="margin-top:0">${titles[work]}</h3>
    <div id="workContent"></div>
  `;

  const content=document.getElementById("workContent");

  if(work==="deposit"){

    content.innerHTML=`
      <input id="amount" type="number" min="1"
        placeholder="जमा राशि">
      <button onclick="depositMoney()">पैसा जमा करें</button>
    `;

  }

  else if(work==="withdraw"){

    content.innerHTML=`
      <input id="amount" type="number" min="1"
        placeholder="निकासी राशि">
      <button onclick="withdrawMoney()">पैसा निकालें</button>
    `;

  }

  else if(work==="balance"){

    const c=getSelectedCustomer();

    content.innerHTML=`
      <div class="notice">
        उपलब्ध Balance: <b>${money(c.balance)}</b>
      </div>
      <br>
      <button onclick="returnToCustomer()">Back</button>
    `;

  }

  else if(work==="transfer"){

    content.innerHTML=`
      <input id="transferAccount"
        placeholder="Receiver Account Number">

      <input id="amount"
        type="number"
        min="1"
        placeholder="Transfer Amount">

      <button onclick="transferMoney()">Transfer</button>
    `;

  }

  else if(work==="kyc"){

    const c=getSelectedCustomer();

    content.innerHTML=`
      <p>Current KYC Status:
        <b>${c.kyc}</b>
      </p>

      <input id="kycNumber"
        placeholder="KYC Reference Number">

      <button onclick="updateKyc()">KYC Update</button>
    `;

  }

  else if(work==="cheque"){

    const c=getSelectedCustomer();

    content.innerHTML=`
      <p>Status: <b>${c.cheque}</b></p>

      <button onclick="issueCheque()">
        Issue Cheque Book
      </button>
    `;

  }

  else if(work==="atm"){

    const c=getSelectedCustomer();

    content.innerHTML=`
      <p>ATM/Debit Card:
        <b>${c.atm}</b>
      </p>

      <button onclick="issueATM()">
        Issue ATM/Debit Card
      </button>
    `;

  }

  else if(work==="upi"){

    const c=getSelectedCustomer();

    content.innerHTML=`
      <p>UPI Status:
        <b>${c.upi}</b>
      </p>

      <input id="upiId"
        placeholder="UPI ID">

      <button onclick="registerUPI()">
        Register UPI
      </button>
    `;

  }

  else if(work==="fd"){

    content.innerHTML=`
      <input id="fdAmount"
        type="number"
        min="1"
        placeholder="FD Amount">

      <input id="fdYears"
        type="number"
        min="1"
        placeholder="Period (Years)">

      <button onclick="createFD()">
        Create FD
      </button>

      <div id="fdList"></div>
    `;

    renderFD();

  }

  else if(work==="loan"){

    content.innerHTML=`
      <input id="loanAmount"
        type="number"
        min="1"
        placeholder="Loan Amount">

      <select id="loanType">
        <option>Personal Loan</option>
        <option>Home Loan</option>
        <option>Education Loan</option>
        <option>Vehicle Loan</option>
      </select>

      <button onclick="applyLoan()">Apply Loan</button>

      <div id="loanList"></div>
    `;

    renderLoans();

  }

  else if(work==="statement"){

    renderStatement();

  }

  else if(work==="delete"){

    const c=getSelectedCustomer();

    content.innerHTML=`
      <div class="notice">
        Account: <b>${c.account}</b><br>
        Customer: <b>${escapeHtml(c.name)}</b><br>
        Balance: <b>${money(c.balance)}</b>
      </div>

      <br>

      <button class="btn-danger"
        onclick="deleteAccount()">
        Permanently Delete Account
      </button>
    `;

  }

}

function depositMoney(){

  const amount=Number(document.getElementById("amount").value);

  if(amount<=0){
    alert("सही राशि डालें।");
    return;
  }

  const c=getSelectedCustomer();

  c.balance+=amount;

  c.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"Deposit",
    amount:amount,
    details:"Cash deposit"
  });

  saveCustomers();
  updateCustomerDetails();

  alert("₹"+amount.toLocaleString("en-IN")+" जमा हो गए।");

  returnToCustomer();
}

function withdrawMoney(){

  const amount=Number(document.getElementById("amount").value);

  if(amount<=0){
    alert("सही राशि डालें।");
    return;
  }

  const c=getSelectedCustomer();

  if(amount>c.balance){
    alert("Insufficient Balance.");
    return;
  }

  c.balance-=amount;

  c.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"Withdrawal",
    amount:amount,
    details:"Cash withdrawal"
  });

  saveCustomers();
  updateCustomerDetails();

  alert("₹"+amount.toLocaleString("en-IN")+" निकाल दिए गए।");

  returnToCustomer();
}

function transferMoney(){

  const receiverAccount =
    document.getElementById("transferAccount").value.trim();

  const amount=
    Number(document.getElementById("amount").value);

  if(!/^\d{12}$/.test(receiverAccount)){
    alert("Receiver का 12-अंकीय Account Number डालें।");
    return;
  }

  if(receiverAccount===selectedAccount){
    alert("अपने ही account में transfer नहीं कर सकते।");
    return;
  }

  if(amount<=0){
    alert("सही राशि डालें।");
    return;
  }

  const sender=getSelectedCustomer();

  const receiver=customers.find(
    c=>c.account===receiverAccount
  );

  if(!receiver){
    alert("Receiver account नहीं मिला।");
    return;
  }

  if(amount>sender.balance){
    alert("Insufficient Balance.");
    return;
  }

  sender.balance-=amount;
  receiver.balance+=amount;

  sender.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"Transfer Debit",
    amount:amount,
    details:"To "+receiver.account
  });

  receiver.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"Transfer Credit",
    amount:amount,
    details:"From "+sender.account
  });

  saveCustomers();
  updateCustomerDetails();

  alert("Transfer successful.");

  returnToCustomer();
}

function updateKyc(){

  const ref=document.getElementById("kycNumber").value.trim();

  if(!ref){
    alert("KYC reference number डालें।");
    return;
  }

  const c=getSelectedCustomer();

  c.kyc="Updated";

  c.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"KYC Update",
    amount:0,
    details:ref
  });

  saveCustomers();

  alert("KYC Update complete.");

  returnToCustomer();
}

function issueCheque(){

  const c=getSelectedCustomer();

  if(c.cheque==="Issued"){
    alert("Cheque Book पहले से issued है।");
    return;
  }

  c.cheque="Issued";

  c.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"Cheque Book",
    amount:0,
    details:"Issued"
  });

  saveCustomers();

  alert("Cheque Book issued.");

  returnToCustomer();
}

function issueATM(){

  const c=getSelectedCustomer();

  if(c.atm==="Issued"){
    alert("ATM/Debit Card पहले से issued है।");
    return;
  }

  c.atm="Issued";

  c.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"ATM/Debit Card",
    amount:0,
    details:"Issued"
  });

  saveCustomers();

  alert("ATM/Debit Card issued.");

  returnToCustomer();
}

function registerUPI(){

  const upi=document.getElementById("upiId").value.trim();

  if(!upi){
    alert("UPI ID डालें।");
    return;
  }

  const c=getSelectedCustomer();

  c.upi=upi;

  c.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"UPI Registration",
    amount:0,
    details:upi
  });

  saveCustomers();

  alert("UPI registered.");

  returnToCustomer();
}

function createFD(){

  const amount=Number(
    document.getElementById("fdAmount").value
  );

  const years=Number(
    document.getElementById("fdYears").value
  );

  const c=getSelectedCustomer();

  if(amount<=0 || years<=0){
    alert("सही amount और period डालें।");
    return;
  }

  if(amount>c.balance){
    alert("FD के लिए पर्याप्त balance नहीं है।");
    return;
  }

  c.balance-=amount;

  const fd={
    id:Date.now(),
    amount:amount,
    years:years,
    date:new Date().toLocaleDateString("en-IN"),
    status:"Active"
  };

  c.fd.push(fd);

  c.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"FD",
    amount:amount,
    details:years+" years"
  });

  saveCustomers();
  updateCustomerDetails();

  alert("FD successfully created.");

  returnToCustomer();
}

function renderFD(){

  const c=getSelectedCustomer();

  const box=document.getElementById("fdList");

  if(!box) return;

  if(c.fd.length===0){
    box.innerHTML="<p>No FD records.</p>";
    return;
  }

  box.innerHTML=`
    <h4>FD Records</h4>
    <table>
      <tr>
        <th>Amount</th>
        <th>Years</th>
        <th>Date</th>
        <th>Status</th>
      </tr>

      ${c.fd.map(fd=>`
        <tr>
          <td>${money(fd.amount)}</td>
          <td>${fd.years}</td>
          <td>${fd.date}</td>
          <td>${fd.status}</td>
        </tr>
      `).join("")}

    </table>
  `;
}

function applyLoan(){

  const amount=
    Number(document.getElementById("loanAmount").value);

  const type=
    document.getElementById("loanType").value;

  if(amount<=0){
    alert("Loan amount डालें।");
    return;
  }

  const c=getSelectedCustomer();

  const loan={
    id:Date.now(),
    amount:amount,
    type:type,
    date:new Date().toLocaleDateString("en-IN"),
    status:"Application Submitted"
  };

  c.loan.push(loan);

  c.transactions.push({
    date:new Date().toLocaleString("en-IN"),
    type:"Loan Application",
    amount:amount,
    details:type
  });

  saveCustomers();

  alert("Loan application submitted.");

  returnToCustomer();
}

function renderLoans(){

  const c=getSelectedCustomer();
  const box=document.getElementById("loanList");

  if(!box) return;

  if(c.loan.length===0){
    box.innerHTML="<p>No loan applications.</p>";
    return;
  }

  box.innerHTML=`
    <h4>Loan Applications</h4>

    <table>
      <tr>
        <th>Type</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Status</th>
      </tr>

      ${c.loan.map(l=>`
        <tr>
          <td>${escapeHtml(l.type)}</td>
          <td>${money(l.amount)}</td>
          <td>${l.date}</td>
          <td>${l.status}</td>
        </tr>
      `).join("")}

    </table>
  `;
}

function renderStatement(){

  const c=getSelectedCustomer();

  const box=document.getElementById("workContent");

  if(!c.transactions || c.transactions.length===0){
    box.innerHTML="<p>No transactions.</p>";
    return;
  }

  box.innerHTML=`

    <div style="overflow:auto">

    <table>

      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Amount</th>
        <th>Details</th>
      </tr>

      ${c.transactions.slice().reverse().map(t=>`

        <tr>
          <td>${escapeHtml(t.date)}</td>
          <td>${escapeHtml(t.type)}</td>
          <td>${money(t.amount)}</td>
          <td>${escapeHtml(t.details)}</td>
        </tr>

      `).join("")}

    </table>

    </div>

    <br>

    <button onclick="returnToCustomer()">Back</button>
  `;
}

function deleteAccount(){

  const c=getSelectedCustomer();

  const confirmation=
    prompt(
      "Account delete करने के लिए customer का नाम लिखें:"
    );

  if(confirmation !== c.name){
    alert("Name match नहीं हुआ। Account delete नहीं किया गया।");
    return;
  }

  customers=
    customers.filter(x=>x.account!==selectedAccount);

  saveCustomers();

  selectedAccount=null;

  document.getElementById("customerSection")
    .classList.add("hidden");

  alert("Account deleted successfully.");

  showAllCustomers();
}

function returnToCustomer(){

  document.getElementById("workPanel")
    .classList.add("hidden");

  updateCustomerDetails();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* ENTER KEY SEARCH */

document.getElementById("searchAccount")
  .addEventListener("keydown",function(e){

    if(e.key==="Enter"){
      searchCustomer();
    }

  });

/* INITIAL DATA DISPLAY */

showAllCustomers();

</script>

</body>
</html>
